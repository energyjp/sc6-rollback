; sc6rb 0.34.1: rollback for SOULCALIBUR VI online matches. Put this file next to sc6rb.asi (Binaries\Win64\plugins\).
; Both players need the plugin. Against a player without it, the game's own netcode runs, untouched.
; Two players must use the same values for the rbonline_* keys below, or their copies won't turn rollback on together.
[sc6rb]
mode=rbonline

; ---- The network observer underneath (diagnostics only). It writes a trace file (.nobs) to the log folder, up to netobs_trace_mb per
; launch. Set netobs_trace=0 to turn the trace off.
netobs_trace=1
netobs_trace_mb=256
netobs_pkt_bytes=48
netobs_pkt_lines=8
netobs_d2_lines=32
netobs_chan4=1
netobs_offline=0
netobs_cost=1
netobs_t1=1

; ---- Rollback
; The input delay: the base (the smallest delay, in frames).
rbonline_d=2
; 1 = the delay of each battle follows the ping: both PCs put their round trip in the handshake and compute the same delay from it
; (2 frames up to about 266 ms, 3 up to 300 ms, 4 above). 0 = always rbonline_d.
rbonline_d_adapt=1
; How many frames a rollback may go back.
rbonline_max_rb=7
; The plugin can't tell Ranked from Casual or Player Match.
;   rbonline_unranked_ack=1: rollback turns on in ANY online match where both players have the plugin, Ranked included.
;   rbonline_unranked_ack=0: nothing is probed and rollback never turns on (every match runs the game's own netcode).
; rbonline_ranked: keep 0 (1 also turns rollback on in every match, and both PCs must have the same value).
rbonline_ranked=0
rbonline_unranked_ack=1
; Compare a hash of the game state between the two PCs every N frames (a mismatch shows DESYNC on the badge).
rbonline_check_every=60
; The first round rollback may start at (0 = the battle's first round).
rbonline_arm_round=0
; Round starts, KOs and replays run at the game's own input delay from this many frames before each of them.
rbonline_zone_lag_lead=13
; 1 = the PC that runs ahead waits single frames so both stay in step.
rbonline_tsync=1

; ---- The status badge (drawn at the bottom center; F2 hides / shows it)
rbonline_badge=1
; Where: the text's center x and its bottom y, in percent of the frame.
rbonline_badge_x=50
rbonline_badge_y=94
; The size of one font pixel in screen pixels; 0 = from the frame height (720p 1, 1080p 2, 1440p 3, 4K 4).
rbonline_badge_scale=0
; The show / hide key while the game window has focus (F1..F24 or a virtual-key number).
rbonline_badge_key=F2
; A short chime when a battle switches to rollback, and a falling one when it falls back (0 = silent).
rbonline_sound=1

; ---- Plugin-to-plugin channel (Steam P2P; the game itself never reads it)
rbonline_channel=0x52424F4E
rbonline_probe_max=10
rbonline_probe_gap_ms=500
rbonline_resend_ms=250
rbonline_peer_timeout_ms=3000
rbonline_poll_ms=5
; The agreement to turn rollback on must be this old when the round resets, else the next round is proposed.
rbonline_arm_margin_ms=2000
rbonline_l3_zero_kb=256
; On a DESYNC, write a small dump of the game state next to the log.
rbonline_dump=1

; ---- Presentation
; Lip-sync while rollback is on (faces move with the voice lines).
lipsync=1
; Raw Reversal Edge clash bytes in the battle record (diagnostics; 0 = off).
c1a_clash_bytes=0
; Effect notifications a rollback hid are sent once, a little late, from the confirmed frame. 0x120 / 0x128: effect values and positioned
; effects; 0x008: effects such as the Reversal Edge spark; 0x028: sounds (missed sound stops are sent late too); 0x038: voice lines
; (docs/NOTES.md, Part 4). 0x120,0x128 = 0.34.1's set (and the plugin's default when this key is missing).
rb_pres_slots=0x008,0x028,0x038,0x120,0x128
; 1 = an effect value set from a mispredicted frame is put back to the confirmed value.
rb_pres_repair=1

; ---- The fix for SoulCalibur VI's own EvaluateIf bug (docs/NOTES.md, Part 1)
; Two direction checks read one argument too many, a leftover stack value that differs per launch, so a Reversal Edge direction choice can
; register on one PC and not the other. 1 = flip four bytes in memory (never the exe on disk) at the start of rollback and put them back at
; the battle's end, only when both PCs advertise it; a PC that disagrees doesn't pair. 0 = off.
argc_fix=1

; ---- Where the logs go. Empty (the default) = a sc6rb_logs folder next to this file.
; log_dir=D:\sc6rb_logs
